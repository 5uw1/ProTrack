# SonarQube Cloud (sonarcloud.io) analysis, run from .github/workflows/build.yml.
sonar.organization=5uw1
sonar.projectKey=5uw1_ProTrack
sonar.projectName=ProTrack

# Shared Kotlin (every source set), the Android shell (Kotlin, manifest, resources) and the iOS
# Swift host. Gradle build output and the exported Room schemas are not sources.
sonar.sources=composeApp/src/commonMain,composeApp/src/androidMain,composeApp/src/desktopMain,composeApp/src/iosMain,androidApp/src/main,iosApp
sonar.tests=composeApp/src/commonTest,composeApp/src/desktopTest,androidApp/src/test,androidApp/src/androidTest
sonar.sourceEncoding=UTF-8

# Produced by: ./gradlew :composeApp:desktopTest :composeApp:testAndroidHostTest :composeApp:koverXmlReport
# (Kover writes JaCoCo-format XML)
sonar.coverage.jacoco.xmlReportPaths=composeApp/build/reports/kover/report.xml
# Code no CI test run can measure: Kotlin/Native and Swift only run on iOS, and the Android shell's
# Robolectric tests are not instrumented.
sonar.coverage.exclusions=composeApp/src/iosMain/**,iosApp/**,androidApp/src/main/**
# Strings.kt holds every UI text once per language: the repeated structure is the point.
sonar.cpd.exclusions=composeApp/src/commonMain/kotlin/com/suw1labs/worktracker/ui/i18n/Strings.kt
