name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installers
        shell: bash
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe

  macos:
    name: macOS installer (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build macOS installer
        run: ./gradlew :composeApp:packageDmg --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-macos
          path: composeApp/build/compose/binaries/main/dmg/*.dmg

  linux:
    name: Linux package (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Linux package
        run: ./gradlew :composeApp:packageDeb --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-linux
          path: composeApp/build/compose/binaries/main/deb/*.deb

  android:
    name: Android APK (debug) + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build APK
        run: ./gradlew :composeApp:desktopTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-android
          path: androidApp/build/outputs/apk/debug/*.apk
