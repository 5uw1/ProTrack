name: Build

# Push to main / manual run: build + test every platform, upload dev-versioned artifacts.
# Tag push (v1.2.3, v1.2.3-rc1, ...): stamp the exact version, sign when secrets exist,
# publish everything on one GitHub Release, and (optionally) upload the AAB to Google Play.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "25"

jobs:
  # ---------------------------------------------------------------- version
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"                     # v1.2.3-rc1 -> 1.2.3-rc1
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"           # every main build uniquely numbered
          fi
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------- tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Common + Android host tests
        run: ./gradlew :composeApp:desktopTest :composeApp:testAndroidHostTest :androidApp:testDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            composeApp/build/test-results
            androidApp/build/test-results

  # ---------------------------------------------------------------- android
  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4

      # Upload keystore as base64 in ANDROID_KEYSTORE_BASE64 (+ ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Without it the release build is unsigned.
      - name: Check for signing secrets
        env:
          HAS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "HAS_ANDROID_KEYSTORE=$HAS" >> "$GITHUB_ENV"
      - name: Import keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release APK + AAB
        env:
          KEYSTORE_PATH: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -PappVersion=${{ needs.version.outputs.app_version }} \
            -PappVersionCode=${{ needs.version.outputs.version_code }} \
            --no-daemon --stacktrace
      - name: Rename outputs
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/*.apk out/WorkTracker-${{ needs.version.outputs.app_version }}-android.apk
          cp androidApp/build/outputs/bundle/release/*.aab out/WorkTracker-${{ needs.version.outputs.app_version }}-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-android
          path: out/*
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # ---------------------------------------------------------------- windows
  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI + EXE
        shell: bash
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe -PappVersion=${{ needs.version.outputs.app_version }} --no-daemon --stacktrace
      - name: Rename outputs
        shell: bash
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/msi/*.msi out/WorkTracker-${{ needs.version.outputs.app_version }}-windows.msi
          cp composeApp/build/compose/binaries/main/exe/*.exe out/WorkTracker-${{ needs.version.outputs.app_version }}-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-windows
          path: out/*

  # ---------------------------------------------------------------- macos
  macos:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4

      # Developer ID signing + notarization, only on tags and only once the secrets exist:
      # MACOS_CERT_P12 (base64 .p12 with "Developer ID Application" cert), MACOS_CERT_PASSWORD,
      # MACOS_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_ID, APPLE_APP_PASSWORD (app-specific password), APPLE_TEAM_ID.
      - name: Check for Developer ID secret
        env:
          HAS: ${{ secrets.MACOS_CERT_P12 != '' }}
        run: echo "HAS_DEVELOPER_ID=$HAS" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_DEVELOPER_ID == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG (signed + notarized when configured)
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/* && "$HAS_DEVELOPER_ID" == "true" ]]; then
            EXTRA="-Pcompose.desktop.mac.sign=true \
                   -Pcompose.desktop.mac.signing.identity=${{ secrets.MACOS_SIGNING_IDENTITY }} \
                   -Pcompose.desktop.mac.notarization.appleID=${{ secrets.APPLE_ID }} \
                   -Pcompose.desktop.mac.notarization.password=${{ secrets.APPLE_APP_PASSWORD }} \
                   -Pcompose.desktop.mac.notarization.teamID=${{ secrets.APPLE_TEAM_ID }}"
            TASKS=":composeApp:packageDmg :composeApp:notarizeDmg"
          else
            TASKS=":composeApp:packageDmg"
          fi
          ./gradlew $TASKS -PappVersion=${{ needs.version.outputs.app_version }} $EXTRA --no-daemon --stacktrace
      - name: Rename outputs
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/dmg/*.dmg out/WorkTracker-${{ needs.version.outputs.app_version }}-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-macos
          path: out/*
      - name: Clean up signing keychain
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/cert.p12"

  # ---------------------------------------------------------------- linux
  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb -PappVersion=${{ needs.version.outputs.app_version }} --no-daemon --stacktrace
      - name: Rename outputs
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/deb/*.deb out/WorkTracker-${{ needs.version.outputs.app_version }}-linux.deb
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-linux
          path: out/*

  # ---------------------------------------------------------------- release (tags only)
  release:
    needs: [version, android, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WorkTracker-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAG=""
          if [[ "${{ needs.version.outputs.prerelease }}" == "true" ]]; then FLAG="--prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $FLAG

  # ---------------------------------------------------------------- google play (tags only, when configured)
  play-store:
    needs: [version, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check for Play service account
        env:
          HAS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "HAS_PLAY=$HAS" >> "$GITHUB_ENV"
          if [[ "$HAS" != "true" ]]; then
            echo "::warning title=Play upload skipped::Repository secret PLAY_SERVICE_ACCOUNT_JSON is not set, so the AAB was not uploaded to Google Play."
          fi
      - name: Check the AAB was signed with the upload key
        if: env.HAS_PLAY == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "$HAS_KEYSTORE" != "true" ]]; then
            echo "::error title=Unsigned AAB::ANDROID_KEYSTORE_BASE64 is not set; Google Play rejects unsigned bundles. Add the keystore secrets (see README) and re-run."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        if: env.HAS_PLAY == 'true'
        with:
          name: WorkTracker-android
          path: android
      - name: Upload AAB to Google Play (internal testing track)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.suw1labs.worktracker
          releaseFiles: android/*.aab
          track: internal
          status: completed
