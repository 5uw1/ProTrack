name: Build

# Push to main / pull request / manual run: lint, scan, test every platform, upload dev-versioned
# artifacts. Tag push (v1.2.3, v1.2.3-rc1, ...): stamp the exact version, sign when secrets exist,
# publish everything on one GitHub Release, and (optionally) upload the AAB to Google Play.
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job writes (it creates the GitHub Release).
permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks. Pushes to main and tags
# always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "25"
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"   # osv-scanner_linux_amd64

jobs:
  # ---------------------------------------------------------------- version
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"                     # v1.2.3-rc1 -> 1.2.3-rc1
          else
            VERSION="1.0.0-dev.${GITHUB_RUN_NUMBER}"           # every non-tag build uniquely numbered
          fi
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------- code quality + security
  quality:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Script injection, leaked credentials, unpinned or compromised actions (exceptions in
      # .github/zizmor.yml). The token lets it look up known-vulnerable and impostor action commits.
      - name: Workflow security lint (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.16.0 --format=github .
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch
      - name: Android Lint (correctness, security, performance)
        run: ./gradlew :androidApp:lintRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-release.*
      # SBOM of what the apps ship (release/desktop/iOS runtime dependencies, no test or build
      # tooling), exact resolved versions. Attached to the GitHub Release on tags.
      - name: Generate SBOM (CycloneDX)
        run: |
          ./gradlew cyclonedxBom --no-daemon --stacktrace
          mkdir -p out
          cp build/reports/cyclonedx/bom.json "out/WorkTracker-$APP_VERSION-sbom.cdx.json"
      - name: Known vulnerabilities in shipped dependencies (OSV-Scanner)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L "out/WorkTracker-$APP_VERSION-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTracker-sbom
          path: out/*

  # ---------------------------------------------------------------- tests
  # Common + desktop + Android host tests with coverage. The SonarQube Cloud scan runs here too, so it
  # can read the coverage report from the same checkout.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # empty on fork PRs: the scan step is then skipped
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history and tags, for SonarQube blame, new-code detection and the version below
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch
      - name: Tests with coverage (Kover)
        run: |
          ./gradlew :composeApp:desktopTest :composeApp:testAndroidHostTest :androidApp:testDebugUnitTest \
            :composeApp:koverXmlReport --no-daemon --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            composeApp/build/test-results
            androidApp/build/test-results
            composeApp/build/reports/kover/report.xml
      # SonarQube's "new code since previous version" restarts whenever projectVersion changes, so
      # it is the release a build leads to: the tag's version on tags, otherwise the patch after the
      # latest release tag (the same rule as iosApp/ci_scripts/ci_pre_xcodebuild.sh).
      - name: Analysis version
        if: env.SONAR_TOKEN != ''
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          else
            LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
            V="$(echo "${LAST:-v0.0.0}" | sed -E 's/^v//; s/-.*$//' | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')"
          fi
          echo "SONAR_PROJECT_VERSION=$V" >> "$GITHUB_ENV"
      - name: Cache SonarQube packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Project keys, sources and the coverage report path are in sonar-project.properties.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          args: >
            -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}

  # ---------------------------------------------------------------- android
  android:
    needs: [version, quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      APP_VERSION_CODE: ${{ needs.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch

      # Upload keystore as base64 in ANDROID_KEYSTORE_BASE64 (+ ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Without it the release build is unsigned.
      # Pull requests always build unsigned: the upload key only signs code that is on main or tagged.
      - name: Check for signing secrets
        env:
          HAS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' }}
        run: echo "HAS_ANDROID_KEYSTORE=$HAS" >> "$GITHUB_ENV"
      - name: Import keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release APK + AAB
        env:
          KEYSTORE_PATH: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          STORE_PASSWORD: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ env.HAS_ANDROID_KEYSTORE == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            -PappVersion="$APP_VERSION" \
            -PappVersionCode="$APP_VERSION_CODE" \
            --no-daemon --stacktrace
      - name: Rename outputs
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/release/*.apk "out/WorkTracker-$APP_VERSION-android.apk"
          cp androidApp/build/outputs/bundle/release/*.aab "out/WorkTracker-$APP_VERSION-android.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTracker-android
          path: out/*
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # ---------------------------------------------------------------- windows
  windows:
    needs: [version, quality, test]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch
      - name: Build MSI + EXE
        shell: bash
        run: ./gradlew :composeApp:packageMsi :composeApp:packageExe -PappVersion="$APP_VERSION" --no-daemon --stacktrace
      # The installers bundle a trimmed Java runtime; a module the code needs but the runtime lacks
      # only shows at launch ("Failed to launch JVM", v1.0.16). Fail the build instead.
      - name: Bundled runtime has the modules the app needs
        shell: bash
        run: |
          for m in java.desktop java.net.http java.prefs; do
            grep -q "$m" composeApp/build/compose/tmp/main/runtime/release || { echo "::error title=Runtime module missing::$m is not in the bundled Java runtime (add it to nativeDistributions.modules)"; exit 1; }
          done
      - name: Rename outputs
        shell: bash
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/msi/*.msi "out/WorkTracker-$APP_VERSION-windows.msi"
          cp composeApp/build/compose/binaries/main/exe/*.exe "out/WorkTracker-$APP_VERSION-windows.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTracker-windows
          path: out/*

  # ---------------------------------------------------------------- macos
  macos:
    needs: [version, quality, test]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch

      # Developer ID signing + notarization, only on tags and only once the secrets exist:
      # MACOS_CERT_P12 (base64 .p12 with "Developer ID Application" cert), MACOS_CERT_PASSWORD,
      # MACOS_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"),
      # APPLE_ID, APPLE_APP_PASSWORD (app-specific password), APPLE_TEAM_ID.
      - name: Check for Developer ID secret
        env:
          HAS: ${{ secrets.MACOS_CERT_P12 != '' && startsWith(github.ref, 'refs/tags/') }}
        run: echo "SIGN_MAC=$HAS" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        if: env.SIGN_MAC == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING=()
          while IFS= read -r k; do EXISTING+=("$k"); done < <(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG (signed + notarized when configured)
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.SIGN_MAC == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [[ "$SIGN_MAC" == "true" ]]; then
            ./gradlew :composeApp:packageDmg :composeApp:notarizeDmg -PappVersion="$APP_VERSION" \
              -Pcompose.desktop.mac.sign=true \
              "-Pcompose.desktop.mac.signing.identity=$MACOS_SIGNING_IDENTITY" \
              "-Pcompose.desktop.mac.notarization.appleID=$APPLE_ID" \
              "-Pcompose.desktop.mac.notarization.password=$APPLE_APP_PASSWORD" \
              "-Pcompose.desktop.mac.notarization.teamID=$APPLE_TEAM_ID" \
              --no-daemon --stacktrace
          else
            ./gradlew :composeApp:packageDmg -PappVersion="$APP_VERSION" --no-daemon --stacktrace
          fi
      # The installers bundle a trimmed Java runtime; a module the code needs but the runtime lacks
      # only shows at launch ("Failed to launch JVM", v1.0.16). Fail the build instead.
      - name: Bundled runtime has the modules the app needs
        shell: bash
        run: |
          for m in java.desktop java.net.http java.prefs; do
            grep -q "$m" composeApp/build/compose/tmp/main/runtime/release || { echo "::error title=Runtime module missing::$m is not in the bundled Java runtime (add it to nativeDistributions.modules)"; exit 1; }
          done
      - name: Rename outputs
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/dmg/*.dmg "out/WorkTracker-$APP_VERSION-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTracker-macos
          path: out/*
      - name: Clean up signing keychain
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/cert.p12"

  # ---------------------------------------------------------------- linux
  linux:
    needs: [version, quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}   # releases build from scratch
      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb -PappVersion="$APP_VERSION" --no-daemon --stacktrace
      # The installers bundle a trimmed Java runtime; a module the code needs but the runtime lacks
      # only shows at launch ("Failed to launch JVM", v1.0.16). Fail the build instead.
      - name: Bundled runtime has the modules the app needs
        shell: bash
        run: |
          for m in java.desktop java.net.http java.prefs; do
            grep -q "$m" composeApp/build/compose/tmp/main/runtime/release || { echo "::error title=Runtime module missing::$m is not in the bundled Java runtime (add it to nativeDistributions.modules)"; exit 1; }
          done
      - name: Rename outputs
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/deb/*.deb "out/WorkTracker-$APP_VERSION-linux.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WorkTracker-linux
          path: out/*

  # ---------------------------------------------------------------- release (tags only)
  release:
    needs: [version, android, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: WorkTracker-*
          path: dist
          merge-multiple: true
      # Create the release first (idempotent: re-running the job keeps the existing one), then upload
      # every asset separately with retries – large uploads occasionally get an HTTP 500 from GitHub.
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then FLAG="--prerelease"; fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --repo "$REPO" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $FLAG
          fi
          for f in dist/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$f" --repo "$REPO" --clobber; then break; fi
              if [[ "$attempt" == "5" ]]; then echo "::error title=Asset upload failed::$f"; exit 1; fi
              echo "upload of $f failed (attempt $attempt), retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          done

  # ---------------------------------------------------------------- google play (tags only, when configured)
  play-store:
    needs: [version, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for Play service account
        env:
          HAS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "HAS_PLAY=$HAS" >> "$GITHUB_ENV"
          if [[ "$HAS" != "true" ]]; then
            echo "::warning title=Play upload skipped::Repository secret PLAY_SERVICE_ACCOUNT_JSON is not set, so the AAB was not uploaded to Google Play."
          fi
      - name: Check the AAB was signed with the upload key
        if: env.HAS_PLAY == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "$HAS_KEYSTORE" != "true" ]]; then
            echo "::error title=Unsigned AAB::ANDROID_KEYSTORE_BASE64 is not set; Google Play rejects unsigned bundles. Add the keystore secrets (see README) and re-run."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_PLAY == 'true'
        with:
          name: WorkTracker-android
          path: android
      - name: Upload AAB to Google Play (internal testing track)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.suw1labs.worktracker
          releaseFiles: android/*.aab
          track: internal
          status: completed
